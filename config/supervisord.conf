; Supervisord configuration for BYD Voice Assistant Workers
; Place in /etc/supervisor/conf.d/byd-workers.conf

[program:byd-pdf-worker]
command=php /var/www/byd/workers/queue_worker.php pdf_processing
directory=/var/www/byd
autostart=true
autorestart=true
startretries=3
numprocs=2
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/www/byd/logs/worker-pdf.log
stderr_logfile=/var/www/byd/logs/worker-pdf-error.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
user=www-data

[program:byd-spec-worker]
command=php /var/www/byd/workers/queue_worker.php spec_sync
directory=/var/www/byd
autostart=true
autorestart=true
startretries=3
numprocs=1
stdout_logfile=/var/www/byd/logs/worker-spec.log
stderr_logfile=/var/www/byd/logs/worker-spec-error.log
user=www-data

[program:byd-notification-worker]
command=php /var/www/byd/workers/queue_worker.php notifications
directory=/var/www/byd
autostart=true
autorestart=true
numprocs=1
stdout_logfile=/var/www/byd/logs/worker-notif.log
user=www-data
